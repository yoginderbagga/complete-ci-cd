#Goal: DEMONSTRATE FULL WORKING CI CD PIPELINE with DOCKER
name: CI/CD Full Pipeline

on:
  push:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout the Code
        uses: actions/checkout@v4


      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Get short commit hash
        id: vars
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build Docker image
        run: | 
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/complete-ci-cd:latest .
            -t ${{ secrets.DOCKER_USERNAME }}/complete-ci-cd:sha-${{ env.SHORT_SHA }} .

      - name: Push Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/complete-ci-cd:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/complete-ci-cd:sha-${{ env.SHORT_SHA }}
